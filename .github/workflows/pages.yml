name: Deploy map to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate JavaScript and source data
        run: |
          node --check drone-map/dist/app.js
          node --check drone-map/dist/events.js
          python3 drone-map/scripts/build-data.py
          git diff --exit-code -- drone-map/dist/events.js drone-map/dist/eu_foreign_drone_events_2026_consolidated.md
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static map
        uses: actions/upload-pages-artifact@v3
        with:
          path: drone-map/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
