name: Deploy map to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate JavaScript and source data
        run: |
          python3 -m unittest discover -s drone-map/tests -v
          python3 drone-map/scripts/build-data.py --check
          node --check drone-map/dist/app.js
          node --check drone-map/dist/mobile.js
          node --check drone-map/dist/analytics.js
          node --check drone-map/dist/events.js
          node --check drone-map/dist/media.js
          for file in drone-map/dist/i18n/*.js; do node --check "$file"; done
          node drone-map/scripts/check-i18n.js
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static map
        uses: actions/upload-pages-artifact@v3
        with:
          path: drone-map/dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
