<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Social preview card</title>
  <!-- Rendered to og-image.png by og/render.py at 1200×630. It reads the same
       data files as the map, so every data update produces a current card. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@700;800&display=block">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      background: #112228;
      color: #fff;
      font-family: 'DM Sans', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .copy {
      position: absolute;
      inset: 0 auto 0 0;
      width: 748px;
      padding: 52px 56px 46px 64px;
      display: flex;
      flex-direction: column;
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand svg { width: 42px; height: 42px; flex: none; fill: none; stroke: #9cd0cb; stroke-width: 1.5; }
    .brand svg .core { fill: #ff8b7e; stroke: none; }
    .brand-title { font-size: 23px; font-weight: 700; letter-spacing: 0.06em; white-space: nowrap; }
    .brand-title span { font-weight: 400; color: #c7d8db; }
    .brand-sub { margin-top: 3px; font-size: 15px; font-weight: 500; letter-spacing: 0.12em; color: #8fa9b0; }

    .trend { margin-top: 36px; }
    .delta {
      display: flex;
      align-items: center;
      gap: 18px;
      font-family: Manrope, system-ui, sans-serif;
      font-weight: 800;
      font-size: 148px;
      line-height: 0.92;
      letter-spacing: -0.045em;
      color: #ff8b7e;
    }
    .delta svg { width: 70px; height: 62px; flex: none; fill: currentColor; }
    .delta.down svg { transform: rotate(180deg); }
    .delta.flat svg { display: none; }
    .delta-label { margin-top: 18px; font-size: 27px; font-weight: 500; color: #d2e1e4; }
    .compare { margin-top: 8px; font-size: 19px; color: #8fa9af; }
    .compare .dot { display: inline-block; width: 11px; height: 11px; margin-right: 7px; border-radius: 50%; background: #ff8b7e; vertical-align: 1px; }

    .latest { margin-top: auto; }
    .latest-label { font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: #9cd0cb; text-transform: uppercase; }
    .latest-label i { font-style: normal; color: #ff8b7e; }
    .latest-headline {
      margin-top: 9px;
      font-size: 29px;
      font-weight: 600;
      line-height: 1.22;
      letter-spacing: -0.01em;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .footer { margin-top: 30px; padding-top: 18px; border-top: 1px solid #2c4953; }
    .stats { font-size: 19px; color: #b7cdd2; }
    .stats b { font-family: Manrope, system-ui, sans-serif; font-weight: 800; color: #fff; }
    .stats .sep { color: #4b6770; padding: 0 6px; }
    .honesty { margin-top: 5px; font-size: 15px; color: #7d9aa1; }

    .map {
      position: absolute;
      inset: 0 0 0 auto;
      width: 452px;
      height: 630px;
      background: #0c1a1f;
      border-left: 1px solid #243d46;
    }
    .map .coast { fill: none; stroke: #395c67; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .map .grid { stroke: #172d34; stroke-width: 1; }
    .map .label { font-size: 12.5px; font-weight: 600; letter-spacing: 0.14em; fill: #557880; text-anchor: middle; }
    .map .label.sea { font-style: italic; font-weight: 500; letter-spacing: 0.04em; font-size: 14px; fill: #4a6f79; text-anchor: start; }
    .map .recent { fill: #ff8b7e; fill-opacity: 0.9; stroke: #0c1a1f; stroke-width: 1.2; }
    .map .earlier { fill: #6f959f; fill-opacity: 0.55; stroke: #0c1a1f; stroke-width: 1.2; }
    .map .newest { fill: none; stroke: #fff; stroke-width: 2.5; }
    .domain {
      position: absolute;
      right: 24px;
      bottom: 24px;
      padding: 9px 16px;
      border-radius: 999px;
      background: #112228;
      border: 1px solid #395c67;
      font-size: 19px;
      font-weight: 600;
      color: #9cd0cb;
    }
  </style>
</head>
<body>
  <section class="copy">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="10"/><circle cx="16" cy="16" r="4"/>
        <path d="M16 2v28M2 16h28"/><circle class="core" cx="16" cy="16" r="2.6"/>
      </svg>
      <div>
        <div class="brand-title" id="brand-title"></div>
        <div class="brand-sub" id="edition"></div>
      </div>
    </div>
    <div class="trend">
      <div class="delta" id="delta"><svg viewBox="0 0 70 62" aria-hidden="true"><path d="M35 0 70 62H0z"/></svg><span id="delta-value"></span></div>
      <p class="delta-label" id="delta-label"></p>
      <p class="compare" id="compare"></p>
    </div>
    <div class="latest">
      <p class="latest-label" id="latest-label"></p>
      <p class="latest-headline" id="latest-headline"></p>
    </div>
    <div class="footer">
      <p class="stats" id="stats"></p>
      <p class="honesty" id="honesty"></p>
    </div>
  </section>
  <svg class="map" id="map" viewBox="0 0 452 630" aria-hidden="true"></svg>
  <div class="domain">droneincidents.eu</div>

  <script src="../events.js"></script>
  <script src="../pages-data.js"></script>
  <script src="../trend-data.js"></script>
  <script src="../geo-outline.js"></script>
  <script src="../i18n/en.js"></script>
  <script src="fonts.js"></script>
  <script src="card.js"></script>
</body>
</html>
